preview:
  the-preview: Final project (src)
active_dataset: poster
fix_data: true
datasets:
  lego:
    data_dir: data/lego
    output_dir: outputs/src/lego
    output_dir_fixed: outputs/src_fixed/lego
    n_iter: 20000
    resize_to:
    - 200
    - 200
    znear: 0.01
    zfar: 10.0
    min_depth: 2.0
    max_depth: 6.0
    use_silhouette_loss: true
    test_every: null
    n_figure_views: 4
    contraction_center:
    - 0.0
    - 0.0
    - 0.0
    contraction_radius: 4.5
    lindisp_switch: 4.0
    scene_bound: 1.5
  poster:
    data_dir: data/poster
    output_dir: outputs/src/poster
    output_dir_fixed: outputs/src_fixed/poster
    n_iter: 30000
    resize_to:
    - 480
    - 270
    znear: 0.01
    zfar: 20.0
    min_depth: 0.2
    max_depth: 50.0
    use_silhouette_loss: false
    test_every: 8
    n_figure_views: 4
    contraction_center:
    - 0.0
    - 0.0
    - 0.0
    contraction_radius: 4.5
    lindisp_switch: 5.0
    scene_bound: 4.5
model:
  n_harmonic_functions: 10
  n_harmonic_functions_dir: 4
  omega0: 3.14159265
  include_input: true
  n_hidden_neurons: 256
  architecture: nerf
  hashgrid:
    levels: 16
    features: 2
    log2_table_size: 19
    base_res: 16
    max_res: 2048
    hidden: 64
  appearance_dim: 16
render:
  n_rays_per_image: 400
  n_pts_per_ray: 128
  n_batches_full_render: 16
train:
  batch_size: 4
  learning_rate: 0.0005
  lr_decay_at: 0.75
  lr_decay_factor: 0.1
  lr_schedule: step
  lr_final: 1.0e-05
  lr_warmup: 0
  adam_eps: 1.0e-08
  huber_scaling: 0.1
  distortion_weight: 0.01
  interlevel_weight: 1.0
  seed: 1
  vis_every: 2500
  checkpoint_every: 1000
evaluation:
  max_test_views: 25
  lpips_net: vgg
  figures_dir: outputs/src/figures
  figures_dir_fixed: outputs/src_fixed/figures
  loss_smoothing_window: 100
smoke_test:
  n_iter: 1000
  vis_every: 250
  output_dir: outputs/src/smoke_test
  min_loss_drop: 0.3
experiment: enc_mlp_dist_prop_contract_app
sampler:
  type: proposal
  stratified: true
  n_coarse: 128
  n_fine: 64
  density_uses_delta: true
  spacing: lindisp
  contract: true
  proposal_hidden: 128

# This run: dataset = poster, experiment = enc_mlp_dist_prop_contract_app, n_iter = 30000
